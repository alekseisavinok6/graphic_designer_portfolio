<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interfaz Completa con Clip-Path</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="header">
  <div class="overlay">
    <h1>Diseño Moderno</h1>
    <p>Transforma tus ideas con CSS clip-path y diseños creativos.</p>
    <a href="#gallery" class="btn">Explorar</a>
  </div>
</header>
<main>
  <section id="gallery" class="gallery">
    <h2>Nuestros Proyectos</h2>
    <div class="cards">
      <div class="card">
        <h3>Proyecto 1</h3>
        <p>Un diseño innovador para el futuro.</p>
      </div>
      <div class="card">
        <h3>Proyecto 2</h3>
        <p>Soluciones prácticas con creatividad.</p>
      </div>
      <div class="card">
        <h3>Proyecto 3</h3>
        <p>Fusionando tecnología y diseño.</p>
      </div>
    </div>
  </section>
  <section id="contact" class="contact">
    <h2>Contacto</h2>
    <form>
      <div class="form-group">
        <input type="text" placeholder="Nombre" required>
      </div>
      <div class="form-group">
        <input type="email" placeholder="Correo Electrónico" required>
      </div>
      <div class="form-group">
        <textarea placeholder="Mensaje" rows="4" required></textarea>
      </div>
      <button type="submit" class="btn">Enviar</button>
    </form>
  </section>
</main>
<footer class="footer">
  <p>&copy; 2024 Diseñado con <span>&#10084;</span> por Tu Compañía</p>
</footer>
</body>
</html>
